<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 28px; color: #4a3f8f; }
    .header p { color: #888; font-size: 14px; margin-top: 6px; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: bold; color: #444; margin-bottom: 6px; }
    label span { color: red; }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    input[type="tel"],
    select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #667eea; }

    .two-col { display: flex; gap: 15px; }
    .two-col .form-group { flex: 1; }

    /* Radio & Checkbox */
    .radio-group, .check-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 5px;
    }
    .radio-group label, .check-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #555;
    }
    input[type="radio"], input[type="checkbox"] { width: 16px; height: 16px; accent-color: #667eea; }

    /* File */
    input[type="file"] {
      padding: 10px;
      border: 2px dashed #667eea;
      background: #f5f3ff;
      cursor: pointer;
    }

    /* Range */
    input[type="range"] { width: 100%; accent-color: #667eea; }

    /* Submit */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-reset {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .divider {
      border: none;
      border-top: 2px solid #f0f0f0;
      margin: 25px 0;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
      padding-left: 10px;
    }
    .note { font-size: 12px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 Student Registration</h1>
      <p>Fill in the details below to register for the course</p>
    </div>

    <form action="#" method="post" enctype="multipart/form-data">

      <!-- PERSONAL INFO -->
      <div class="section-title">👤 Personal Information</div>

      <div class="two-col">
        <div class="form-group">
          <label>First Name <span>*</span></label>
          <input type="text" name="fname" placeholder="e.g. Rahul" required />
        </div>
        <div class="form-group">
          <label>Last Name <span>*</span></label>
          <input type="text" name="lname" placeholder="e.g. Sharma" required />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address <span>*</span></label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210" />
      </div>

      <div class="two-col">
        <div class="form-group">
          <label>Date of Birth <span>*</span></label>
          <input type="date" name="dob" required />
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" placeholder="18" min="10" max="80" />
        </div>
      </div>

      <div class="form-group">
        <label>Gender <span>*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male" required /> Male</label>
          <label><input type="radio" name="gender" value="female" /> Female</label>
          <label><input type="radio" name="gender" value="other" /> Other</label>
          <label><input type="radio" name="gender" value="prefer_not" /> Prefer not to say</label>
        </div>
      </div>

      <hr class="divider"/>

      <!-- ACADEMIC INFO -->
      <div class="section-title">🎓 Academic Information</div>

      <div class="form-group">
        <label>Course <span>*</span></label>
        <select name="course" required>
          <option value="" disabled selected>-- Select a Course --</option>
          <option>Web Development (HTML, CSS, JS)</option>
          <option>Full Stack Development (MERN)</option>
          <option>Python Programming</option>
          <option>Data Structures & Algorithms</option>
          <option>Machine Learning & AI</option>
        </select>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label>Education Level</label>
          <select name="edu">
            <option>10th Pass</option>
            <option>12th Pass</option>
            <option>Undergraduate</option>
            <option>Graduate</option>
            <option>Postgraduate</option>
          </select>
        </div>
        <div class="form-group">
          <label>Batch</label>
          <select name="batch">
            <option>Morning (8AM - 10AM)</option>
            <option>Afternoon (2PM - 4PM)</option>
            <option>Evening (6PM - 8PM)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Programming Experience Level</label>
        <input type="range" name="experience" min="0" max="5" step="1" value="1"/>
        <p class="note">0 = Absolute Beginner &nbsp;|&nbsp; 5 = Expert</p>
      </div>

      <div class="form-group">
        <label>Skills You Already Know</label>
        <div class="check-group">
          <label><input type="checkbox" name="skills" value="html" /> HTML</label>
          <label><input type="checkbox" name="skills" value="css" /> CSS</label>
          <label><input type="checkbox" name="skills" value="js" /> JavaScript</label>
          <label><input type="checkbox" name="skills" value="python" /> Python</label>
          <label><input type="checkbox" name="skills" value="git" /> Git</label>
          <label><input type="checkbox" name="skills" value="none" /> None yet!</label>
        </div>
      </div>

      <hr class="divider"/>

      <!-- OTHER -->
      <div class="section-title">📎 Additional Details</div>

      <div class="form-group">
        <label>Profile Photo</label>
        <input type="file" name="photo" accept="image/*" />
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="3" placeholder="Enter your full address..."></textarea>
      </div>

      <div class="form-group">
        <label>How did you hear about us?</label>
        <select name="referral">
          <option>YouTube</option>
          <option>Friend / Family</option>
          <option>Instagram</option>
          <option>Google Search</option>
          <option>College Notice Board</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <div class="check-group">
          <label><input type="checkbox" name="terms" required /> I agree to the Terms &amp; Conditions <span style="color:red">*</span></label>
        </div>
      </div>

      <input type="submit" class="btn-submit" value="✅ Submit Registration" />
      <input type="reset" class="btn-reset" value="🔄 Reset Form" />

    </form>
  </div>
</body>
</html>
